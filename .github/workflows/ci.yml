name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Weekly build test (Sunday 2 AM UTC)
    - cron: '0 2 * * 0'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Lint and test
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black isort

      - name: Run Ruff (lint)
        run: ruff check scripts/ --output-format=github

      - name: Run Black (format check)
        run: black --check scripts/

      - name: Run isort (import sort check)
        run: isort --check-only scripts/

      - name: Run pytest (if tests exist)
        run: |
          if [ -d "tests" ]; then pytest tests/ -v; else echo "No tests directory, skipping"; fi

  # Build Docker image
  build:
    needs: lint-test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Test Docker image runs
  test-image:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Pull image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Test crypto news script (dry run)
        run: |
          docker run --rm \
            -e OPENROUTER_API_KEY=test \
            -e TG_BOT_TOKEN=test \
            -e TG_CHAT_ID=test \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            python scripts/crypto_news_scorer.py --help || true

      - name: Test backup script (dry run)
        run: |
          docker run --rm \
            -e RCLONE_ONEDRIVE_REMOTE=test \
            -e RCLONE_R2_REMOTE=test \
            -e R2_BUCKET=test \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            python scripts/backup.py --help || true

  # Deploy to VM (manual trigger)
  deploy:
    needs: test-image
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM
        run: |
          echo "Deploy step - customize for your VM"
          echo "Example: ssh user@vm 'cd ~/mech-automation && git pull && docker compose -f infra/docker-compose.yml up -d --build'"
          echo "Add SSH key to GitHub Secrets for automated deploy"

  # Migration test (weekly)
  migration-test:
    needs: build
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Simulate fresh VM migration
        run: |
          echo "=== MIGRATION TEST ==="
          # Clone to temp dir
          git clone . /tmp/mech-automation-test
          cd /tmp/mech-automation-test
          
          # Create minimal .env
          cp config/.env.example config/.env
          sed -i 's/your-key-here/test/g' config/.env
          sed -i 's/your-secure-password/test/g' config/.env
          sed -i 's/changeme-/test-/g' config/.env
          
          # Build and test
          docker compose -f infra/docker-compose.yml build
          
          # Quick health check
          docker compose -f infra/docker-compose.yml up -d
          sleep 10
          docker compose -f infra/docker-compose.yml ps
          
          # Test scripts
          docker compose -f infra/docker-compose.yml run --rm crypto-news python scripts/crypto_news_scorer.py --help || true
          docker compose -f infra/docker-compose.yml run --rm backup python scripts/backup.py --help || true
          
          # Cleanup
          docker compose -f infra/docker-compose.yml down -v
          
          echo "=== MIGRATION TEST PASSED ==="